name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and stage artifacts without publishing a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $ver = "0.0.0-dev.$($env:GITHUB_RUN_NUMBER)"
          }
          Write-Host "Resolved version: $ver"
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build WindowsTweaks.exe
        shell: pwsh
        run: |
          if (Test-Path .\WindowsTweaks.exe) {
            Remove-Item -Force .\WindowsTweaks.exe
          }
          & .\src\build.ps1
          if (-not (Test-Path .\WindowsTweaks.exe)) {
            throw 'Expected WindowsTweaks.exe was not produced by src/build.ps1'
          }

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

      - name: Stage release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $staging = 'release-staging'
          $portable = 'portable-staging'
          New-Item -ItemType Directory -Force -Path $staging, $portable | Out-Null

          $setupExe = "dist\WindowsTweaks-$($env:VERSION)-setup.exe"
          if (-not (Test-Path $setupExe)) {
            throw "Expected installer not found: $setupExe"
          }
          Copy-Item -Path $setupExe -Destination "$staging\WindowsTweaks-$($env:VERSION)-setup.exe"
          Copy-Item -Path 'WindowsTweaks.exe' -Destination "$staging\WindowsTweaks-$($env:VERSION).exe"

          Copy-Item -Path 'WindowsTweaks.exe' -Destination $portable
          Copy-Item -Path '*.reg' -Destination $portable
          Copy-Item -Path 'WinUtil-Advanced.bat' -Destination $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "$staging\WindowsTweaks-$($env:VERSION)-portable.zip" -Force

          Get-ChildItem -Path $staging | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-staging/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
